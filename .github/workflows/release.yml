name: Release

# Maintained in the private source repository and published here by its
# release sync together with the rest of .github/; edit it there, not here.
# The release sync pushes a vMAJOR.MINOR.PATCH tag, which builds conductor-main
# for every supported platform, attaches the archives, SHA256SUMS and build
# provenance attestations to the GitHub Release for the tag, and then
# publishes two multi-platform container images built from the same Linux
# binaries: conductor alone, and the all-in-one image that bundles the
# jobworkerp all-in-one server (verified on each architecture first). Tests
# run in the private CI before a release is tagged; this workflow only
# builds, so that the build of every published artifact is publicly visible.
#
# Only a tag push (which needs write access) may start this workflow, the
# build jobs get a read-only token and run on GitHub-hosted runners only, and
# every job is limited to GitHub so that the private source, which tracks this
# file, never runs it. The private source checks these rules on every change.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A re-pushed tag re-runs this; let a fresh run supersede an in-flight one
# without cancelling (avoid a half-uploaded release).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# `shell: bash` makes every step run as `bash -e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  BINARY: conductor-main
  IMAGE: ghcr.io/jobworkerp-rs/jobworkerp-conductor
  AIO_IMAGE: ghcr.io/jobworkerp-rs/jobworkerp-conductor-all-in-one

jobs:
  # The license listing of every crate linked into the binaries, shipped in
  # each archive and image. It fails on a license about.toml does not accept.
  licenses:
    name: Third-party licenses
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-about
        run: bash scripts/install-cargo-about.sh "${RUNNER_TEMP}/cargo-about"

      - name: Generate license listing
        run: |
          mkdir -p dist
          bash scripts/generate-third-party-licenses.sh dist/THIRD-PARTY-LICENSES.txt

      - name: Upload license listing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    if: github.server_url == 'https://github.com'
    needs: licenses
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are fully static (musl), so they run on any
          # distribution without a glibc floor. Each is built natively on its
          # architecture so the artifact check can run it. cc-rs looks for a
          # target-prefixed musl compiler that Ubuntu's musl-tools does not
          # ship for aarch64, so the C dependencies (SQLite, ring, aws-lc)
          # name their compiler explicitly.
          - name: linux-x86_64
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extra_env: CC_x86_64_unknown_linux_musl=musl-gcc
          - name: linux-aarch64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extra_env: CC_aarch64_unknown_linux_musl=musl-gcc
          # 11.0 is the oldest macOS Rust supports on Apple Silicon.
          - name: darwin-arm64
            runs_on: macos-15
            target: aarch64-apple-darwin
            extra_env: MACOSX_DEPLOYMENT_TARGET=11.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Export platform settings
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          for kv in ${EXTRA_ENV}; do
            echo "${kv}" >>"${GITHUB_ENV}"
          done

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install protoc
        run: bash scripts/install-protoc.sh "${RUNNER_TEMP}/protoc"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No Rust cache: GitHub scopes caches to the ref, and a tag-only
      # workflow can never restore what a previous tag saved.
      - name: Show build environment
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            xcrun --show-sdk-version || true
          else
            grep -E '^(NAME|VERSION)=' /etc/os-release
            # sed reads all input: `head` could SIGPIPE the writer under pipefail.
            musl-gcc --version | sed -n 1p
          fi
          rustc --version --verbose
          "${PROTOC}" --version
          echo "platform settings: ${EXTRA_ENV}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}" -p "${BINARY}" --bin "${BINARY}"

      - name: Download license listing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses

      # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble (._*) files.
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
          # The matrix name is the platform verify-server-artifact.sh checks.
          PLATFORM: ${{ matrix.name }}
          COPYFILE_DISABLE: '1'
        run: |
          built="target/${TARGET}/release/${BINARY}"
          bash scripts/verify-server-artifact.sh "${built}" "${PLATFORM}" "${GITHUB_REF_NAME#v}"
          stage="${BINARY}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp "${built}" LICENSE licenses/THIRD-PARTY-LICENSES.txt README.md README_ja.md dot.env "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          rm -rf "dist/${stage:?}"
          ls -l dist

      # Stored uncompressed: the archive is already gzip-compressed.
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Holds the release write token and signs the provenance of what the build
  # jobs produced.
  publish:
    name: Publish GitHub Release
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The build matrix names (linux-x86_64, ...), not the license listing.
          pattern: '*-*64'
          path: dist
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          ls -l dist
          (cd dist && sha256sum -- *.tar.gz >SHA256SUMS && cat SHA256SUMS)
          # The release sync commit lists the changes since the previous release.
          git log -1 --format=%B >release-notes.md
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # Runs after the release exists, so `latest` never points at an image whose
  # binaries are not published. The image reuses the attested Linux archives
  # instead of building anything; the Dockerfile's target-platform stage runs
  # no command, so no emulation is needed for arm64.
  image:
    name: Publish container image
    if: github.server_url == 'https://github.com'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: archives
          merge-multiple: true

      # Docker platform names: linux/amd64 and linux/arm64.
      - name: Unpack binaries per platform
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            dir="dist/linux-${pair%%:*}"
            mkdir -p "${dir}"
            tar -xzf "archives/${BINARY}-${pair#*:}.tar.gz" -C "${dir}" --strip-components=1
          done
          ls -lR dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: conductor-main/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Builds the all-in-one image for one architecture on its native runner,
  # with the same builder and inputs as the publish job, and runs it through
  # verify-all-in-one-image.sh. Nothing is pushed; arm64 is exercised only
  # here.
  all-in-one-verify:
    name: Verify all-in-one image (${{ matrix.arch }})
    if: github.server_url == 'https://github.com'
    needs: publish
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: archives
          merge-multiple: true

      # dist/all-in-one/linux-<arch>/{conductor,vendor}: the release archive
      # and the pinned third-party inputs, as conductor-main/Dockerfile.all-in-one
      # expects.
      - name: Prepare inputs
        id: inputs
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="dist/all-in-one/linux-${ARCH}"
          mkdir -p "${dir}/conductor"
          tar -xzf "archives/${BINARY}-${TARGET}.tar.gz" -C "${dir}/conductor" --strip-components=1
          bash scripts/fetch-all-in-one-inputs.sh "${ARCH}" "${dir}/vendor"
          cat "${dir}/vendor/versions.env" >>"${GITHUB_OUTPUT}"
          echo "CONDUCTOR_VERSION=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
          # Records the runner's Docker in the log; arm64 is built only here.
          docker version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: conductor-main/Dockerfile.all-in-one
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.AIO_IMAGE }}:verify
          # Labels are defined in the Dockerfile from these values.
          build-args: |
            CONDUCTOR_VERSION=${{ steps.inputs.outputs.CONDUCTOR_VERSION }}
            JOBWORKERP_VERSION=${{ steps.inputs.outputs.JOBWORKERP_VERSION }}
            TINI_VERSION=${{ steps.inputs.outputs.TINI_VERSION }}
            PROTOC_VERSION=${{ steps.inputs.outputs.PROTOC_VERSION }}

      - name: Verify image
        env:
          CONDUCTOR_VERSION: ${{ steps.inputs.outputs.CONDUCTOR_VERSION }}
          JOBWORKERP_VERSION: ${{ steps.inputs.outputs.JOBWORKERP_VERSION }}
        run: bash scripts/verify-all-in-one-image.sh "${AIO_IMAGE}:verify" "${CONDUCTOR_VERSION}" "${JOBWORKERP_VERSION}"

  # Pushes the all-in-one image once every architecture passed verification,
  # rebuilt from the same pinned inputs (base digest, release archives,
  # SHA-256-pinned third-party files).
  all-in-one-image:
    name: Publish all-in-one image
    if: github.server_url == 'https://github.com'
    needs: all-in-one-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: archives
          merge-multiple: true

      # Labels describe both platforms, so their bundled versions must match.
      - name: Prepare inputs
        id: inputs
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            dir="dist/all-in-one/linux-${pair%%:*}"
            mkdir -p "${dir}/conductor"
            tar -xzf "archives/${BINARY}-${pair#*:}.tar.gz" -C "${dir}/conductor" --strip-components=1
            bash scripts/fetch-all-in-one-inputs.sh "${pair%%:*}" "${dir}/vendor"
          done
          cmp dist/all-in-one/linux-amd64/vendor/versions.env dist/all-in-one/linux-arm64/vendor/versions.env
          cat dist/all-in-one/linux-amd64/vendor/versions.env >>"${GITHUB_OUTPUT}"
          echo "CONDUCTOR_VERSION=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: conductor-main/Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.AIO_IMAGE }}:${{ github.ref_name }}
            ${{ env.AIO_IMAGE }}:latest
          # Labels are defined in the Dockerfile from these values.
          build-args: |
            CONDUCTOR_VERSION=${{ steps.inputs.outputs.CONDUCTOR_VERSION }}
            JOBWORKERP_VERSION=${{ steps.inputs.outputs.JOBWORKERP_VERSION }}
            TINI_VERSION=${{ steps.inputs.outputs.TINI_VERSION }}
            PROTOC_VERSION=${{ steps.inputs.outputs.PROTOC_VERSION }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AIO_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
